
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJEEVA | Digital Design Studio</title>
<meta name="description" content="AJEEVA Digital Design Studio — Create. Design. Elevate.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #05090c;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  overflow: hidden;
  isolation: isolate;

  background:
    radial-gradient(ellipse at center,
    #17434a 0%,
    #0b1c20 42%,
    #030608 82%);
}

/* CINEMATIC LIGHT */
.hero::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: #00c6b4;
  filter: blur(160px);
  opacity: .12;
  z-index: -1;
  animation: lightPulse 6s ease-in-out infinite alternate;
}

@keyframes lightPulse {
  from { transform: scale(.8); opacity: .08; }
  to { transform: scale(1.2); opacity: .18; }
}

/* CINEMATIC RINGS */
.ring {
  position: absolute;
  width: min(75vw, 520px);
  aspect-ratio: 1;
  border: 2px solid #c5a35a;
  border-radius: 50%;
  transform: rotateX(68deg);
  box-shadow:
    0 0 25px #00b9a455,
    inset 0 0 30px #00b9a422;
  animation: rotate 18s linear infinite;
  pointer-events: none;
  z-index: 0;
}

.ring.two {
  width: min(95vw, 680px);
  border-color: #00aeb0;
  animation-duration: 25s;
  animation-direction: reverse;
}

@keyframes rotate {
  from {
    transform: rotateX(68deg) rotateZ(0deg);
  }
  to {
    transform: rotateX(68deg) rotateZ(360deg);
  }
}

/* LOGO */
.logo {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  mix-blend-mode: screen;
  filter: drop-shadow(0 0 22px #c49a50);
}

.logo {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 22px #c49a50);
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.85);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* BUTTON */
.btn {
  position: relative;
  z-index: 3;
  margin-top: 35px;
  padding: 15px 32px;
  border: 1px solid #c5a35a;
  color: #e5c77f;
  text-decoration: none;
  letter-spacing: 2px;
  font-size: 12px;
  transition: .35s ease;
}

.btn:hover {
  background: #c5a35a;
  color: #050b0e;
  box-shadow: 0 0 25px #c5a35a66;
  transform: translateY(-3px);
}

/* ABOUT SECTION */
section {
  padding: 100px 22px;
  text-align: center;
  background:
    linear-gradient(180deg, #080f12, #0b171a);
}

section h2 {
  color: #d7b56d;
  letter-spacing: 4px;
  margin-bottom: 25px;
  font-size: clamp(22px, 4vw, 34px);
}

section p {
  color: #aabbbb;
  line-height: 1.9;
  max-width: 650px;
  margin: auto;
  font-size: 15px;
}

/* FOOTER */
footer {
  padding: 28px 15px;
  text-align: center;
  color: #718786;
  font-size: 12px;
  letter-spacing: 1px;
  background: #05090c;
}

/* MOBILE & TABLET */
@media (max-width: 600px) {
  .logo-container {
    width: 90%;
  }

  .ring {
    width: 90vw;
  }

  .ring.two {
    width: 110vw;
  }

  section {
    padding: 75px 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<header class="hero">

  <div class="ring"></div>
  <div class="ring two"></div>

  <div class="logo-container">
    <img
      class="logo"
      src="./Ajith.png"
      alt="AJEEVA Digital Design Studio"
    >
  </div>

  <a class="btn" href="#about">
    EXPLORE STUDIO
  </a>

</header>

<section id="about">
  <h2>WE CREATE EXPERIENCES</h2>

  <p>
    We transform ideas into meaningful digital experiences
    through creative design, visual identity and modern technology.
  </p>
</section>

<footer>
  © 2026 AJEEVA DIGITAL DESIGN STUDIO
  <br><br>
  CREATE. DESIGN. ELEVATE.
</footer>

</body>
</html>
