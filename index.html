
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJEEVA | Digital Design Studio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #05090c;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  overflow: hidden;

  background:
    radial-gradient(ellipse at center,
    #17434a 0%,
    #0b1c20 42%,
    #030608 82%);
}

/* CINEMATIC RINGS */
.ring {
  position: absolute;
  width: min(75vw, 520px);
  aspect-ratio: 1;
  border: 2px solid #c5a35a;
  border-radius: 50%;
  transform: rotateX(68deg);
  box-shadow:
    0 0 25px #00b9a455,
    inset 0 0 30px #00b9a422;
  animation: rotate 18s linear infinite;
  pointer-events: none;
}

.ring.two {
  width: min(95vw, 680px);
  border-color: #00aeb0;
  animation-duration: 25s;
  animation-direction: reverse;
}

@keyframes rotate {
  from {
    transform: rotateX(68deg) rotateZ(0deg);
  }
  to {
    transform: rotateX(68deg) rotateZ(360deg);
  }
}

/* LOGO */
.logo {
  display: block;
  width: min(80%, 380px);
  height: auto;
  position: relative;
  z-index: 2;

  mix-blend-mode: screen;
  filter: drop-shadow(0 0 22px #c49a50);

  animation: reveal 2s ease both;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.85);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* BUTTON */
.btn {
  position: relative;
  z-index: 3;
  margin-top: 35px;
  padding: 15px 32px;

  border: 1px solid #c5a35a;
  color: #e5c77f;
  text-decoration: none;
  letter-spacing: 2px;
  font-size: 12px;

  transition: .35s ease;
}

.btn:hover {
  background: #c5a35a;
  color: #050b0e;
  box-shadow: 0 0 25px #c5a35a66;
}

/* ABOUT SECTION */
section {
  padding: 90px 22px;
  text-align: center;
  background: #080f12;
}

section h2 {
  color: #d7b56d;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

section p {
  color: #aabbbb;
  line-height: 1.8;
  max-width: 650px;
  margin: auto;
}

/* FOOTER */
footer {
  padding: 25px;
  text-align: center;
  color: #718786;
  font-size: 12px;
  background: #05090c;
}

/* MOBILE */
@media (max-width: 600px) {
  .logo {
    width: 90%;
  }

  .ring {
    width: 90vw;
  }

  .ring.two {
    width: 110vw;
  }

  section {
    padding: 70px 20px;
  }
}
</style>
</head>

<body>

<header class="hero">

  <div class="ring"></div>
  <div class="ring two"></div>

  <img
    class="logo"
    src="AJEEVA-Logo.png"
    alt="AJEEVA Digital Design Studio"
  >

  <a class="btn" href="#about">
    EXPLORE STUDIO
  </a>

</header>

<section id="about">
  <h2>WE CREATE EXPERIENCES</h2>

  <p>
    We transform ideas into meaningful digital experiences
    through creative design, visual identity and modern technology.
  </p>
</section>

<footer>
  © 2026 AJEEVA DIGITAL DESIGN STUDIO
</footer>

</body>
</html>
